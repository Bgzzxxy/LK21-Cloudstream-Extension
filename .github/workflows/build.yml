name: Build Cloudstream Extensions

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Plugins
        uses: recloudstream/build-plugins@master

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cloudstream-Repo
          path: build/
